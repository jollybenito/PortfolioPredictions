services:
  db:
    image: postgres:15-alpine
    container_name: portfolio_db_cont
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: portfolio_app_cont
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    # We keep the container running so we can exec into it
    command: tail -f /dev/null

  web:
    build: .
    container_name: portfolio_web_cont
    env_file: .env
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0

